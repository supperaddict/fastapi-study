name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fastapi
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: fastapi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fastapi -d fastapi_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://fastapi:ci_only_password@127.0.0.1:5432/unused
      TEST_DATABASE_URL: postgresql+psycopg://fastapi:ci_only_password@127.0.0.1:5432/fastapi_test
      JWT_SECRET_KEY: ci-only-test-key-not-for-deployment-123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python prepare_test_db.py
      - run: python -m pytest -q
